!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survey Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 id="title">My Survey Form</h1>
    <p id="description">Please fill out this short survey to help us improve our services.</p>

    <form id="survey-form">
      <label id="name-label" for="name">Name:</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your full name"
        required
      />

      <label id="email-label" for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email address"
        required
      />

      <label id="number-label" for="number">Age:</label>
      <input
        type="number"
        id="number"
        name="age"
        min="10"
        max="120"
        placeholder="Enter your age"
      />

      <label for="dropdown">What is your current role?</label>
      <select id="dropdown" name="role">
        <option value="student">Student</option>
        <option value="job">Full Time Job</option>
        <option value="other">Other</option>
      </select>

      <p>Would you recommend us to a friend?</p>
      <label>
        <input type="radio" name="recommend" value="yes" /> Yes
      </label>
      <label>
        <input type="radio" name="recommend" value="no" /> No
      </label>

      <p>What would you like to see improved? (Check all that apply)</p>
      <label>
        <input type="checkbox" name="improve" value="design" /> Front-end Design
      </label>
      <label>
        <input type="checkbox" name="improve" value="backend" /> Back-end Services
      </label>
      <label>
        <input type="checkbox" name="improve" value="support" /> Customer Support
      </label>

      <p>Any comments or suggestions?</p>
      <textarea
        name="comments"
        rows="4"
        cols="40"
        placeholder="Enter your comment here..."
      ></textarea>

      <button type="submit" id="submit">Submit</button>
    </form>
  </body>
</html>
